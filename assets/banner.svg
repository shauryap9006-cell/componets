<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="340" fill="none">
  <defs>
    <style>
      .bg { fill: #0d0f12; }
      .border-line { stroke: #23272e; stroke-width: 1px; }
      .grid-dot { fill: #2a2f38; }
      .title-text { fill: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.04em; }
      .sub-text { fill: #9ca3af; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; letter-spacing: 0.12em; }
      .accent-text { fill: #ef4444; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: bold; letter-spacing: 0.08em; }
      .wire { stroke: #374151; stroke-width: 1px; }
      .wire-acc { stroke: #ef4444; stroke-width: 1.5px; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .border-line { stroke: #e2e8f0; }
        .grid-dot { fill: #cbd5e1; }
        .title-text { fill: #0f172a; }
        .sub-text { fill: #64748b; }
        .accent-text { fill: #dc2626; }
        .wire { stroke: #cbd5e1; }
        .wire-acc { stroke: #dc2626; }
      }

      @keyframes caliperMotion {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(140px); }
      }

      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes waveBar1 { 0%, 100% { height: 10px; } 50% { height: 38px; } }
      @keyframes waveBar2 { 0%, 100% { height: 26px; } 50% { height: 12px; } }
      @keyframes waveBar3 { 0%, 100% { height: 18px; } 50% { height: 44px; } }
      @keyframes waveBar4 { 0%, 100% { height: 34px; } 50% { height: 16px; } }
      @keyframes waveBar5 { 0%, 100% { height: 14px; } 50% { height: 32px; } }

      @keyframes blinkLamp {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }

      @keyframes scanBeam {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(70px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" rx="10" class="bg" />
  <rect x="1" y="1" width="998" height="338" rx="9" fill="none" class="border-line" />

  <!-- Modular Hairline Grid Ticks -->
  <g class="grid-dot">
    <circle cx="40" cy="40" r="1.5" /><circle cx="200" cy="40" r="1.5" /><circle cx="360" cy="40" r="1.5" /><circle cx="520" cy="40" r="1.5" /><circle cx="680" cy="40" r="1.5" /><circle cx="840" cy="40" r="1.5" /><circle cx="960" cy="40" r="1.5" />
    <circle cx="40" cy="170" r="1.5" /><circle cx="200" cy="170" r="1.5" /><circle cx="360" cy="170" r="1.5" /><circle cx="520" cy="170" r="1.5" /><circle cx="680" cy="170" r="1.5" /><circle cx="840" cy="170" r="1.5" /><circle cx="960" cy="170" r="1.5" />
    <circle cx="40" cy="300" r="1.5" /><circle cx="200" cy="300" r="1.5" /><circle cx="360" cy="300" r="1.5" /><circle cx="520" cy="300" r="1.5" /><circle cx="680" cy="300" r="1.5" /><circle cx="840" cy="300" r="1.5" /><circle cx="960" cy="300" r="1.5" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 68)">
    <!-- Live Status Lamp -->
    <circle cx="0" cy="0" r="5" fill="#ef4444" style="animation: blinkLamp 1.6s ease-in-out infinite;" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.4" />
    <text x="20" y="4" class="accent-text">SYSTEM ACTIVE · 107 PLATES · 17 VARIANTS</text>
    
    <!-- Title -->
    <text x="0" y="48" class="title-text">HAIRLINE / UI</text>
    <text x="0" y="78" class="sub-text">107 PHYSICAL INTERFACE MECHANISMS · ZERO DEPENDENCIES</text>
  </g>

  <!-- Animated Interactive Instrument 1: Vernier Caliper Slider -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="260" height="90" rx="4" fill="none" class="border-line" />
    <text x="14" y="24" class="sub-text" font-size="10">FIG. 010 · CALIPER SLIDER</text>
    <line x1="14" y1="52" x2="246" y2="52" class="wire" />
    <!-- Caliper Graduation Ticks -->
    <path d="M14 52 v6 M34 52 v3 M54 52 v6 M74 52 v3 M94 52 v6 M114 52 v3 M134 52 v6 M154 52 v3 M174 52 v6 M194 52 v3 M214 52 v6 M234 52 v3 M246 52 v6" class="wire" />
    <!-- Sliding Vernier Jaw with animation -->
    <g style="animation: caliperMotion 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;">
      <line x1="30" y1="36" x2="30" y2="68" class="wire-acc" />
      <rect x="22" y="40" width="16" height="24" rx="2" fill="none" class="wire-acc" />
      <circle cx="30" cy="52" r="2" fill="#ef4444" />
      <text x="30" y="80" text-anchor="middle" class="accent-text" font-size="9">42.0 mm</text>
    </g>
  </g>

  <!-- Animated Interactive Instrument 2: Waveform Tape Head -->
  <g transform="translate(370, 200)">
    <rect x="0" y="0" width="260" height="90" rx="4" fill="none" class="border-line" />
    <text x="14" y="24" class="sub-text" font-size="10">FIG. 079 · WAVEFORM TAPE</text>
    <!-- Dynamic Animated Bars -->
    <g transform="translate(24, 60)">
      <rect x="0" y="-10" width="4" height="20" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar1 1.2s ease-in-out infinite;" />
      <rect x="12" y="-16" width="4" height="32" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar3 1.5s ease-in-out infinite;" />
      <rect x="24" y="-8" width="4" height="16" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar2 1.1s ease-in-out infinite;" />
      <rect x="36" y="-22" width="4" height="44" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar4 1.4s ease-in-out infinite;" />
      <rect x="48" y="-12" width="4" height="24" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar1 1.3s ease-in-out infinite;" />
      <rect x="60" y="-18" width="4" height="36" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar5 1.6s ease-in-out infinite;" />
      <rect x="72" y="-14" width="4" height="28" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar3 1.2s ease-in-out infinite;" />
      <rect x="84" y="-20" width="4" height="40" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar2 1.5s ease-in-out infinite;" />
      <rect x="96" y="-6" width="4" height="12" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar4 1.3s ease-in-out infinite;" />
      <rect x="108" y="-16" width="4" height="32" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar1 1.4s ease-in-out infinite;" />
      <rect x="120" y="-12" width="4" height="24" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar5 1.1s ease-in-out infinite;" />
      <rect x="132" y="-24" width="4" height="48" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar3 1.7s ease-in-out infinite;" />
      <rect x="144" y="-10" width="4" height="20" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar2 1.2s ease-in-out infinite;" />
      <rect x="156" y="-18" width="4" height="36" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar4 1.5s ease-in-out infinite;" />
      <rect x="168" y="-14" width="4" height="28" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar1 1.3s ease-in-out infinite;" />
      <rect x="180" y="-22" width="4" height="44" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar5 1.6s ease-in-out infinite;" />
      <rect x="192" y="-8" width="4" height="16" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar3 1.2s ease-in-out infinite;" />
      <rect x="204" y="-16" width="4" height="32" rx="1" fill="#3b82f6" opacity="0.8" style="animation: waveBar2 1.4s ease-in-out infinite;" />
    </g>
    <!-- Scrubber Hairline Playhead -->
    <line x1="126" y1="36" x2="126" y2="82" class="wire-acc" />
    <circle cx="126" cy="36" r="2.5" fill="#ef4444" />
  </g>

  <!-- Animated Interactive Instrument 3: Radar Sweep / Station Clock -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="260" height="90" rx="4" fill="none" class="border-line" />
    <text x="14" y="24" class="sub-text" font-size="10">FIG. 053 · STATION CLOCK</text>
    <!-- Clock Dial -->
    <g transform="translate(195, 50)">
      <circle cx="0" cy="0" r="28" fill="none" class="wire" />
      <circle cx="0" cy="0" r="24" fill="none" class="wire" stroke-dasharray="1 5" />
      <!-- Rotating Radar Beam / Hand -->
      <g style="animation: radarSweep 8s linear infinite;">
        <line x1="0" y1="0" x2="0" y2="-24" class="wire-acc" />
        <circle cx="0" cy="-18" r="3" fill="#ef4444" />
      </g>
      <circle cx="0" cy="0" r="2.5" fill="#ef4444" />
    </g>
    <text x="14" y="52" class="accent-text" font-size="16">14:00:42</text>
    <text x="14" y="70" class="sub-text" font-size="9">SYNCHRONIZED BOURSE</text>
  </g>

  <!-- Corner Crop Hairlines -->
  <g class="wire">
    <path d="M12 24 V12 H24" />
    <path d="M988 24 V12 H976" />
    <path d="M12 316 V328 H24" />
    <path d="M988 316 V328 H976" />
  </g>
</svg>